# Exactcomms hub on the MG8. Board basics (RTT console, 32 kHz crystal, DC/DC off) come from
# boards/arm/mg8_nrf52840. Upload servers default to a test echo server; see Kconfig and prod.conf.

CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=64

# Legacy APPROTECT on this AAD0 chip: only read UICR, never write it
CONFIG_NRF_APPROTECT_USE_UICR=y

CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_REBOOT=y

# Modem UART (uart1, enabled in app.overlay)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Upload queue in the W25Q64 external flash (SPIM2)
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y

# BLE central: scan for C10 tags, connect, download over GATT notifications
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
# Hub beacon that tells tags a hub is near
CONFIG_BT_BROADCASTER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_DEVICE_NAME="MG8-hub"
CONFIG_BT_MAX_CONN=1
# Tag data packets are up to 400 bytes in one notification, so ask for the same 500 byte MTU
# as the ESP32 hub
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_GATT_DM=n
CONFIG_BT_RX_STACK_SIZE=4096
