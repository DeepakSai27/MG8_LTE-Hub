# MG8 bring-up: logs over SEGGER RTT through the J-Link, no UART console
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_PRINTK=y

# The MG8 has no DC/DC inductors. The DK board definition enables both converters, which
# makes the supply collapse to ~2.3 V and the chip brown out in a loop. Keep the LDOs.
CONFIG_BOARD_ENABLE_DCDC=n
CONFIG_BOARD_ENABLE_DCDC_HV=n

# The MG8 32 kHz crystal is unconfirmed, run the low frequency clock from the RC oscillator
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# The MG8 nRF52840 (AAD0) uses legacy APPROTECT: the erased UICR value keeps debug open.
# SystemInit only reads UICR here, it never writes it.
CONFIG_NRF_APPROTECT_USE_UICR=y

# Pins are driven directly with the nrf_gpio HAL
CONFIG_GPIO=y
CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=4096
