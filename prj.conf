# MG8 bring-up. Board basics (RTT console, no UART console, 32 kHz crystal) are in
# boards/arm/mg8_nrf52840. The board never enables the DC/DC converters; src/main.c refuses to
# build if they are on.

CONFIG_PRINTK=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
# AT console input from the J-Link (RTT channel 0 down buffer)
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=256

# The MG8 nRF52840 (AAD0) uses legacy APPROTECT: the erased UICR value keeps debug open.
# SystemInit only reads UICR here, it never writes it.
CONFIG_NRF_APPROTECT_USE_UICR=y

# Modem pins and UART are driven directly with the nrf_gpio HAL and registers
CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=4096

# BLE test: advertise as MG8-bringup and passively scan for nearby devices
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="MG8-bringup"

# W25Q64JV external flash on SPIM2
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_FLASH_JESD216_API=y

# flash_get_page_count() for the flash test
CONFIG_FLASH_PAGE_LAYOUT=y
